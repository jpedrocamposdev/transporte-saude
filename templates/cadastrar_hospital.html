<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Hospital - Transporte Saúde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans antialiased pb-12">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-cyan-600 text-white flex items-center justify-center shadow-md shadow-cyan-600/20">
                    <i data-lucide="building-2" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-base sm:text-lg leading-tight">Transporte Saúde</h1>
                    <p class="text-xs text-slate-500 font-medium">Rede de Hospitais & Unidades</p>
                </div>
            </a>

            <a href="/" class="inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-xl transition-all">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Voltar ao Painel</span>
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            
            <div class="p-6 border-b border-slate-100 bg-slate-50/50 flex items-start gap-4">
                <div class="w-12 h-12 rounded-2xl bg-cyan-100 text-cyan-700 flex items-center justify-center shrink-0 shadow-sm">
                    <i data-lucide="building-2" class="w-6 h-6"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Cadastrar Nova Unidade de Saúde</h2>
                    <p class="text-sm text-slate-500 mt-0.5">Adicione os detalhes do hospital, clínica ou UPA parceira.</p>
                </div>
            </div>

            {% if mensagem %}
                <div class="m-6 p-4 rounded-xl flex items-center gap-3 text-sm font-medium {% if 'Erro' in mensagem %}bg-red-50 text-red-700 border border-red-200{% else %}bg-brand-50 text-brand-800 border border-brand-200{% endif %}">
                    <i data-lucide="{% if 'Erro' in mensagem %}alert-circle{% else %}check-circle-2{% endif %}" class="w-5 h-5 shrink-0"></i>
                    <span>{{ mensagem }}</span>
                </div>
            {% endif %}

            <form method="POST" class="p-6 sm:p-8 space-y-6">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Código da Unidade <span class="text-cyan-600">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="hash" class="w-4 h-4"></i>
                            </div>
                            <input type="text" name="codigo" required placeholder="Ex: HOSP-01" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-cyan-500 outline-none text-sm text-slate-800 font-medium">
                        </div>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Nome do Hospital / Clínica <span class="text-cyan-600">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="building-2" class="w-4 h-4"></i>
                            </div>
                            <input type="text" name="nome" required placeholder="Ex: Hospital Central" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-cyan-500 outline-none text-sm text-slate-800 font-medium">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Tipo de Unidade <span class="text-cyan-600">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="activity" class="w-4 h-4"></i>
                            </div>
                            <select name="tipo" required class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-cyan-500 outline-none text-sm text-slate-800 font-semibold appearance-none cursor-pointer">
                                <option value="Hospital" selected>Hospital</option>
                                <option value="UPA">UPA</option>
                                <option value="Clínica">Clínica</option>
                                <option value="Posto de Saúde">Posto de Saúde</option>
                                <option value="Laboratório">Laboratório</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Telefone de Contato <span class="text-cyan-600">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="phone" class="w-4 h-4"></i>
                            </div>
                            <input type="tel" 
                                   name="telefone" 
                                   required 
                                   inputmode="numeric"
                                   oninput="this.value = this.value.replace(/[^0-9()\s-]/g, '')"
                                   placeholder="Ex: (16) 99999-8888" 
                                   class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-cyan-500 outline-none text-sm text-slate-800 font-medium">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Cidade <span class="text-cyan-600">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="map" class="w-4 h-4"></i>
                            </div>
                            <input type="text" name="cidade" required placeholder="Ex: Ribeirão Preto" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-cyan-500 outline-none text-sm text-slate-800 font-medium">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Endereço Completo <span class="text-cyan-600">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="map-pin" class="w-4 h-4"></i>
                            </div>
                            <input type="text" name="endereco" required placeholder="Ex: Av. Bandeirantes, 3900" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-cyan-500 outline-none text-sm text-slate-800 font-medium">
                        </div>
                    </div>
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-cyan-600 hover:bg-cyan-700 text-white font-bold px-8 py-3 rounded-xl transition-all shadow-md shadow-cyan-600/20 active:scale-95 text-sm">
                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                        Cadastrar Hospital
                    </button>
                </div>
            </form>
        </div>

    </main>

    <script>
        window.onload = function() {
            lucide.createIcons();
        };
    </script>
</body>
</html>
