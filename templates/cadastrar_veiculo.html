<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Veículo - Transporte Saúde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans antialiased pb-12">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center shadow-md shadow-brand-600/20">
                    <i data-lucide="hospital" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-base sm:text-lg leading-tight">Transporte Saúde</h1>
                    <p class="text-xs text-slate-500 font-medium">Gestão de Frota</p>
                </div>
            </a>

            <a href="/" class="inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-xl transition-all">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Voltar ao Painel</span>
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            
            <div class="p-6 border-b border-slate-100 bg-slate-50/50 flex items-start gap-4">
                <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center shrink-0 shadow-sm">
                    <i data-lucide="truck" class="w-6 h-6"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Cadastrar Veículo</h2>
                    <p class="text-sm text-slate-500 mt-0.5">Adicione um novo veículo para a frota municipal.</p>
                </div>
            </div>

            {% if mensagem %}
                <div class="m-6 p-4 rounded-xl flex items-center gap-3 text-sm font-medium {% if 'Erro' in mensagem %}bg-red-50 text-red-700 border border-red-200{% else %}bg-brand-50 text-brand-800 border border-brand-200{% endif %}">
                    <i data-lucide="{% if 'Erro' in mensagem %}alert-circle{% else %}check-circle-2{% endif %}" class="w-5 h-5 shrink-0"></i>
                    <span>{{ mensagem }}</span>
                </div>
            {% endif %}

            <form method="POST" class="p-6 sm:p-8 space-y-6">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Tipo de Veículo <span class="text-brand-600">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="car-front" class="w-4 h-4"></i>
                            </div>
                            <input type="text" name="tipo" required placeholder="Ex: Van, Ambulância, Spin" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none text-sm text-slate-800 font-medium">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Placa <span class="text-brand-600">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="credit-card" class="w-4 h-4"></i>
                            </div>
                            <input type="text" name="placa" required maxlength="8" placeholder="ABC1234 ou ABC-1234" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none font-mono text-sm text-slate-800 uppercase">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Ano de Fabricação <span class="text-brand-600">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="calendar" class="w-4 h-4"></i>
                            </div>
                            <input type="number" name="ano" min="2000" max="2030" required placeholder="Ex: 2023" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none text-sm text-slate-800 font-medium">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Capacidade (Passageiros) <span class="text-brand-600">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="users" class="w-4 h-4"></i>
                            </div>
                            <input type="number" name="capacidade" min="1" max="60" required placeholder="Ex: 15" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none text-sm text-slate-800 font-medium">
                        </div>
                    </div>
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-amber-600 hover:bg-amber-700 text-white font-bold px-8 py-3 rounded-xl transition-all shadow-md shadow-amber-600/20 active:scale-95 text-sm">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        Salvar Veículo
                    </button>
                </div>
            </form>
        </div>

    </main>

    <script>
        window.onload = function() {
            lucide.createIcons();
        };
    </script>
</body>
</html>
